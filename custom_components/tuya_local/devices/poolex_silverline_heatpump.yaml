name: Pool heat pump
entities:
  - entity: climate
    translation_only_key: pool_heatpump
    dps:
      - id: 1
        name: hvac_mode
        type: boolean
        mapping:
          - dps_val: false
            value: "off"
          - dps_val: true
            value: "heat"
      - id: 2
        name: temperature
        type: integer
        unit: C
        range:
          min: 8
          max: 40
      - id: 3
        name: current_temperature
        type: integer
      - id: 4
        name: preset_mode
        type: string
        mapping:
          - dps_val: auto
            value: auto
          - dps_val: powerful_h
            value: quick_heat
          - dps_val: heat
            value: smart_heat
          - dps_val: silent_h
            value: quiet_heat
          - dps_val: cool
            value: smart_cool
          - dps_val: powerful_c
            value: quick_cool
          - dps_val: silent_c
            value: quiet_cool
  - entity: binary_sensor
    name: Water flow
    class: problem
    category: diagnostic
    dps:
      - id: 13
        type: bitfield
        name: sensor
        mapping:
          - dps_val: 256
            value: true
          - value: false
  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      - id: 13
        type: bitfield
        name: sensor
        mapping:
          - dps_val: 0
            value: false
          - dps_val: 256
            value: false
          - value: true
      - id: 13
        type: bitfield
        name: fault_code
